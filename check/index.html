<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진단</title>
<style>
  body{margin:0;padding:20px;background:#eef7f2;font-family:'Pretendard','Noto Sans KR',sans-serif;color:#2b3d36}
  .box{max-width:820px;margin:0 auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  h1{font-size:19px;margin:0 0 4px}
  .sub{font-size:13px;color:#6b8078;margin-bottom:16px;line-height:1.6}
  .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #eef2f0;font-size:13px;line-height:1.6}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 54px;font-size:11px;font-weight:700;text-align:center;padding:3px 0;border-radius:999px}
  .ok{background:#d9f0e3;color:#1f7a52}
  .no{background:#fde2e2;color:#b4342f}
  .warn{background:#fdf0d5;color:#9a6b12}
  .info{background:#e4edf7;color:#3d5f8a}
  .k{flex:0 0 190px;font-weight:600}
  .v{flex:1;word-break:break-all;white-space:pre-wrap}
  .btn{border:0;background:#4fa585;color:#fff;font-weight:700;font-size:13px;padding:10px 18px;border-radius:10px;cursor:pointer;font-family:inherit}
  .btn.g{background:#7a8f88}
  .bar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .auth{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
  .auth input{flex:1;min-width:150px;padding:9px 12px;border:1px solid #cfe2d8;border-radius:9px;font-family:inherit;font-size:13px;box-sizing:border-box}
  textarea{width:100%;height:170px;margin-top:12px;font-family:ui-monospace,monospace;font-size:11px;padding:10px;border:1px solid #cfe2d8;border-radius:9px;box-sizing:border-box;display:none}
</style>
</head>
<body>
<div class="box">
  <h1>사이트 진단</h1>
  <div class="sub">DB에 실제로 무엇이 들어있는지 확인합니다. 이 페이지는 확인용이므로 나중에 <b>check 폴더째 지워도</b> 됩니다.</div>

  <div class="auth">
    <input type="email" id="dEmail" placeholder="관리자 이메일" autocomplete="username">
    <input type="password" id="dPw" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn" onclick="run(true)">로그인해서 진단</button>
  </div>

  <div id="out"><div class="row"><span class="tag info">…</span><span class="v">진단 준비 중</span></div></div>

  <div class="bar">
    <button class="btn" onclick="run(false)">로그인 없이 다시 진단</button>
    <button class="btn g" onclick="copyAll()">결과 복사</button>
  </div>
  <textarea id="raw" readonly></textarea>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../supabase.js"></script>
<script>
  const lines = [];
  function add(state, key, val) {
    lines.push([state, key, String(val)]);
    document.getElementById('out').innerHTML = lines.map(l =>
      `<div class="row"><span class="tag ${l[0]}">${({ok:'OK',no:'실패',warn:'주의',info:'정보'})[l[0]]}</span>`
      + `<span class="k">${l[1]}</span><span class="v">${l[2].replace(/</g,'&lt;')}</span></div>`).join('');
  }
  function copyAll() {
    const t = document.getElementById('raw');
    t.style.display = 'block';
    t.value = lines.map(l => `[${l[0]}] ${l[1]} :: ${l[2]}`).join('\n');
    t.select(); try { document.execCommand('copy'); } catch (e) {}
  }

  async function run(doLogin) {
    lines.length = 0;
    add('info', '프로젝트 URL', SUPABASE_URL);
    add('info', 'anon 키', SUPABASE_ANON.slice(0, 24) + '…(' + SUPABASE_ANON.length + '자)');

    /* 배포본이 최신인지: 관리자 파일에 옛 비밀번호 상수가 남아 있는지 확인 */
    try {
      const txt = await (await fetch('../admin/index.html?t=' + Date.now())).text();
      const oldPw = /ADMIN_PASSWORD/.test(txt);
      const newAuth = /signInWithPassword/.test(txt);
      add(oldPw ? 'no' : 'ok', '배포된 관리자 버전',
          oldPw ? '옛 버전 — 비밀번호 상수가 아직 있음. 새 파일이 배포되지 않았습니다'
                : (newAuth ? '최신 (Supabase Auth)' : '판정 불가'));
    } catch (e) { add('warn', '배포된 관리자 버전', '확인 실패: ' + e.message); }

    if (doLogin) {
      const email = document.getElementById('dEmail').value.trim();
      const password = document.getElementById('dPw').value;
      const { error } = await db.auth.signInWithPassword({ email, password });
      add(error ? 'no' : 'ok', '관리자 로그인', error ? error.message : email);
    }
    const { data: sess } = await db.auth.getSession();
    add(sess && sess.session ? 'ok' : 'warn', '현재 로그인 상태',
        sess && sess.session ? sess.session.user.email : '비로그인 (쓰기는 실패합니다)');

    /* 표별 행 수 */
    for (const t of ['viewers', 'upbo_types', 'upbo_counts', 'profile']) {
      const { count, error } = await db.from(t).select('*', { count: 'exact', head: true });
      add(error ? 'no' : 'ok', t + ' 행 수', error ? error.message : count);
    }

    /* memo 컬럼 존재 여부 */
    {
      const { error } = await db.from('upbo_counts').select('memo').limit(1);
      add(error ? 'no' : 'ok', 'upbo_counts.memo 컬럼',
          error ? '없음 — 3_security_patch.sql 을 Run 하세요 (' + error.message + ')' : '있음');
    }

    /* 최근 시청자 5명 */
    {
      const { data, error } = await db.from('viewers').select('id,nickname,soop_id,sort_order').order('id', { ascending: false }).limit(5);
      add(error ? 'no' : 'info', '최근 등록 시청자 5명',
          error ? error.message : (data.length ? data.map(v => `#${v.id} ${v.nickname} (${v.soop_id || '-'}) order=${v.sort_order}`).join('\n') : '없음'));
    }

    /* 업보 페이지 표시 설정 */
    {
      const { data, error } = await db.from('profile').select('data').eq('id', 1);
      if (error) add('no', '업보 0개 표시 설정', error.message);
      else {
        const d = (data && data[0] && data[0].data) || {};
        const hide = d['upbo-hide-zero'] !== 'off';
        add(hide ? 'warn' : 'ok', '업보 0개 표시 설정',
            hide ? '숨기기 — 업보 0개인 시청자는 업보 페이지에 안 나옵니다' : '전부 보이기');
      }
    }

    /* 업보 페이지에 실제로 몇 명이 보이는지 */
    {
      const [v, c] = await Promise.all([
        db.from('viewers').select('id'),
        db.from('upbo_counts').select('viewer_id,count')
      ]);
      if (!v.error && !c.error) {
        const has = new Set(c.data.filter(x => x.count > 0).map(x => x.viewer_id));
        add(has.size ? 'ok' : 'no', '업보 페이지에 보일 인원',
            `${has.size}명 / 전체 ${v.data.length}명 (업보 1개 이상인 사람만 표시)`);
      }
    }

    /* 실제 쓰기 테스트: 넣고 → 다시 읽고 → 지운다 */
    {
      const nick = '__진단테스트__' + Date.now();
      const ins = await db.from('viewers').insert({ nickname: nick, soop_id: '', sort_order: 9999 });
      if (ins.error) {
        add('no', '시청자 쓰기 테스트', '등록 실패: ' + ins.error.message + (ins.error.hint ? ' / ' + ins.error.hint : ''));
      } else {
        const back = await db.from('viewers').select('id').eq('nickname', nick);
        if (back.error) add('no', '시청자 쓰기 테스트', '등록 후 조회 실패: ' + back.error.message);
        else if (!back.data.length) add('no', '시청자 쓰기 테스트', '등록은 성공했다고 나왔지만 조회하면 없음 (읽기 정책 확인 필요)');
        else {
          add('ok', '시청자 쓰기 테스트', '등록 → 조회 성공 (#' + back.data[0].id + ')');
          const del = await db.from('viewers').delete().eq('nickname', nick);
          add(del.error ? 'warn' : 'ok', '테스트 행 정리', del.error ? '삭제 실패: ' + del.error.message : '삭제 완료');
        }
      }
    }
  }

  run(false);
</script>
</body>
</html>
